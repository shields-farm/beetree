# Full 31-species known-threat catalog (USDA APHIS honey-bee lists).
threat_species:
  - { id: shb,            name: Small hive beetle,           scientific: Aethina tumida,             kind: pest,     notes: "Larvae slime comb; weak colonies at risk." }
  - { id: wax_moths,      name: Wax moths (greater and lesser), scientific: "Galleria mellonella / Achroia grisella", kind: pest, notes: "Weak/stressed colonies only." }
  - { id: ants,           name: Ants,                        scientific: Formicidae,                 kind: pest,     notes: "Rob weak colonies." }
  - { id: roaches,        name: Cockroaches,                 scientific: Blattodea,                  kind: commensal, notes: "Usually commensal." }
  - { id: earwigs,        name: Earwigs,                     scientific: Forficula auricularia,      kind: commensal, notes: "Usually commensal." }
  - { id: mice,           name: Mice,                        scientific: Mus musculus,               kind: pest,     notes: "Winter nesting in hives." }
  - { id: bears,          name: Bears,                       scientific: Ursus americanus,           kind: pest,     notes: "Physical destruction; regional." }
  - { id: skunks,         name: Skunks,                      scientific: Mephitis mephitis,          kind: pest,     notes: "Scratch entrances, eat bees at night." }
  - { id: raccoons,       name: Raccoons,                    scientific: Procyon lotor,              kind: pest,     notes: "Hive disturbance." }
  - { id: birds_bee_eaters, name: Bee-eating birds,         scientific: "Meropidae / Passeridae",    kind: pest,     notes: "Mostly non-US; noted for completeness." }
  - { id: bots,           name: Bee bots (parasitic phorid fly), scientific: Apocephalus borealis,   kind: parasite, notes: "Zombie fly; emerging threat." }
  - { id: varroa_destructor, name: Varroa destructor,        scientific: Varroa destructor,          kind: parasite, vectors: [dwv, bqcv, sbv, abpv], notes: "#1 managed-bee threat worldwide." }
  - { id: tropilaelaps,   name: Tropilaelaps mites,          scientific: Tropilaelaps clareae,       kind: parasite, notes: "Exotic — not established in continental US." }
  - { id: tracheal_mites, name: Tracheal mites,              scientific: Acarapis woodi,             kind: parasite, notes: "Internal airways." }
  - { id: nosemosis,      name: Nosema,                      scientific: Nosema ceranae,             kind: parasite, notes: "Gut parasite; N. ceranae dominant in GA." }
  - { id: malpighamoeba,  name: Amoeba disease,              scientific: Malpighamoeba mellificae,   kind: parasite, notes: "Rare." }
  - { id: dwv,            name: Deformed wing virus,         scientific: Deformed wing virus,        kind: disease, vectored_by: [varroa_destructor] }
  - { id: sbv,            name: Sacbrood virus,              scientific: Sacbrood virus,             kind: disease, vectored_by: [varroa_destructor] }
  - { id: bqcv,           name: Black queen cell virus,      scientific: Black queen cell virus,     kind: disease, vectored_by: [varroa_destructor] }
  - { id: abpv,           name: Acute bee paralysis virus,   scientific: Acute bee paralysis virus,  kind: disease, vectored_by: [varroa_destructor] }
  - { id: dvpv,           name: Deformed wing virus B,       scientific: DWV-B,                      kind: disease, vectored_by: [varroa_destructor] }
  - { id: kbv,            name: Kashmir bee virus,           scientific: Kashmir bee virus,          kind: disease }
  - { id: cbpv,           name: Chronic bee paralysis virus, scientific: Chronic bee paralysis virus, kind: disease, notes: "Hairless-black syndrome." }
  - { id: sisp,           name: Slow bee paralysis virus,    scientific: Slow bee paralysis virus,   kind: disease }
  - { id: cpbv,           name: Cloudy wing virus,           scientific: Cloudy wing virus,          kind: disease }
  - { id: afb,            name: American foulbrood,          scientific: Paenibacillus larvae,       kind: disease, notifiable: true, notes: "Destroy colony + equipment by law in GA." }
  - { id: efb,            name: European foulbrood,          scientific: Melissococcus plutonius,    kind: disease, notifiable: true }
  - { id: chalkbrood,     name: Chalkbrood,                  scientific: Ascosphaera apis,           kind: disease, notes: "Fungal; cold/stress-linked." }
  - { id: stonebrood,     name: Stonebrood,                  scientific: Aspergillus flavus,         kind: disease }
  - { id: tsbv,           name: Thai sacbrood virus,         scientific: Thai sacbrood virus,        kind: disease, notes: "Exotic; monitor." }
  - { id: spiroplasma,    name: May disease (Spiroplasma),   scientific: "Spiroplasma apis / melliferum", kind: disease, notes: "Spring 'May disease'; GA-documented." }
  - { id: ylh,            name: Yellow-legged hornet,        scientific: Vespa velutina,              kind: predator, severity: monitor, region: "Savannah GA (2023+)", notes: "Invasive. Predates foraging bees at hive entrance. Report sightings to GA Dept of Ag." }
  - { id: ngh,            name: Northern giant hornet,        scientific: Vespa mandarinia,            kind: predator, severity: low, region: "Pacific Northwest (WA/BC)", notes: "Not present in GA. Media calls it 'murder hornet' — confused with yellow-legged hornet. No action needed for GA beekeepers." }

# What the agent SHOULD do when it can't resolve to a defined entity:
undefined_behavior:
  alias_miss: "Unknown pest name — agent should checkpoint with user: 'I don't recognize that pest. Did you mean small hive beetle?'"
  predicate_miss: "Unknown relation type — agent asks which of the defined relations was intended rather than asserting."
  species_miss: "Species lookup returned nothing — agent states plainly and offers nearest defined species."
notes: >
  Catalog sourced from USDA APHIS honey-bee pests/diseases lists; middle-GA
  framing after Ricigliano et al. 2026 (Trends in Biotechnology 44(1):111-127)
  + GBA UGA extension context.
