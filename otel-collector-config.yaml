receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

exporters:
  prometheus:
    endpoint: 0.0.0.0:9999
    namespace: ""
    resource_to_telemetry_conversion:
      enabled: true
    const_labels:
      source: otel-collector
  debug:
    verbosity: basic
    sampling_initial: 2
    sampling_thereafter: 200

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      exporters: [prometheus, debug]