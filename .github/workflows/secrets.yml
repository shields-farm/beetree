# Secret scanning on every push and pull request.
#
# The pre-commit hook in .pre-commit-config.yaml is the fast local gate, but it
# only exists in a clone that has run `pre-commit install`, and `--no-verify`
# skips it. This workflow is the backstop: it runs on the remote, on history,
# and cannot be bypassed from a developer machine.
#
# Uses the gitleaks CLI directly rather than gitleaks/gitleaks-action. The action
# requires a (free) license key for organization-owned repos, and this repo is
# owned by the shields-farm org. The CLI is MIT with no key, and it auto-discovers
# .gitleaks.toml at the repo root, so the same config the local hook uses applies
# here with no extra flags.
name: Secrets

on:
  push:
    branches: [main]
  pull_request:
  # Weekly full-history re-scan. The gitleaks rule set improves over time, so a
  # repo that was clean last month can be flagged by a rule added since.
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    env:
      # Checksum for gitleaks_8.30.1_linux_x64.tar.gz, taken from the
      # gitleaks_8.30.1_checksums.txt published with the release. Pin the version
      # and verify the download so a moved or tampered release asset fails the
      # job instead of running.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: a shallow clone would let a secret committed earlier and
          # quietly removed later pass the scan, which is the whole class of leak
          # this gate exists for.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          curl -sSfL -o "$tarball" "$url"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan full history
        run: gitleaks git --redact --verbose --log-opts="--all" .
