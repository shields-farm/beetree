repos:
  - repo: local
    hooks:
      - id: typecheck
        name: 🔍 typecheck (tsc)
        entry: npm run typecheck
        language: system
        types: [ts, tsx]
        pass_filenames: false
      - id: lint
        name: 🧹 lint (oxlint)
        entry: npx oxlint
        language: system
        types: [ts, tsx]
        pass_filenames: false
      - id: test
        name: 🧪 tests (vitest)
        entry: npx vitest run
        language: system
        types: [ts, tsx]
        pass_filenames: false